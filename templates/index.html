<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            min-height: 100vh;
        }
        .search-card {
            max-width: 650px;
            border-radius: 20px;
        }
        .title-text {
            font-weight: 700;
            color: #1f3b5b;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 search-card mx-auto">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="text-center mb-4 title-text">Search Flights</h1>

                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Source Airport Code</label>
                                    <input type="text" class="form-control form-control-lg" name="origin_code" value="{{ origin_code }}" placeholder="e.g. JFK" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Destination Airport Code</label>
                                    <input type="text" class="form-control form-control-lg" name="dest_code" value="{{ dest_code }}" placeholder="e.g. LAX" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Start Date</label>
                                    <input type="date" class="form-control form-control-lg" name="start_date" value="{{ start_date }}" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">End Date</label>
                                    <input type="date" class="form-control form-control-lg" name="end_date" value="{{ end_date }}" required>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Search Flights
                                </button>
                            </div>
                        </form>

                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
