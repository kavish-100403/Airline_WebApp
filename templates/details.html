<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            min-height: 100vh;
        }
        .details-card {
            max-width: 650px;
            border-radius: 20px;
        }
        .title-text {
            font-weight: 700;
            color: #1f3b5b;
        }
        .info-label {
            color: #6c757d;
            font-size: 0.95rem;
        }
        .info-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: #212529;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 details-card mx-auto">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <h1 class="title-text mb-0">Flight Details</h1>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                Back to Search
                            </a>
                        </div>

                        {% if details %}
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded">
                                        <div class="info-label">Flight Number</div>
                                        <div class="info-value">{{ details[0] }}</div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded">
                                        <div class="info-label">Departure Date</div>
                                        <div class="info-value">{{ details[1] }}</div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded">
                                        <div class="info-label">Plane Type</div>
                                        <div class="info-value">{{ details[2] }}</div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded">
                                        <div class="info-label">Capacity</div>
                                        <div class="info-value">{{ details[3] }}</div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="p-3 bg-warning-subtle rounded">
                                        <div class="info-label">Booked Seats</div>
                                        <div class="info-value">{{ details[4] }}</div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="p-3 bg-success-subtle rounded">
                                        <div class="info-label">Available Seats</div>
                                        <div class="info-value">{{ details[5] }}</div>
                                    </div>
                                </div>
                            </div>
                        {% else %}
                            <div class="alert alert-danger mb-0" role="alert">
                                No details found for this flight.
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
